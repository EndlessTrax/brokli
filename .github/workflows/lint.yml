---
name: Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
