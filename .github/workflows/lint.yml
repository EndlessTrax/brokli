---
name: Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2.5.0
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.5.0

      - name: Run golangci-lint
        run: ~/go/bin/golangci-lint run --timeout=5m ./...
