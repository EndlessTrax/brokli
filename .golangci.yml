# golangci-lint configuration
# See https://golangci-lint.run/usage/configuration/

version: 2

run:
  tests: true
  timeout: 5m

linters:
  enable:
    - goconst
    - gosec
    - misspell
    - unconvert
    - unparam

linters-settings:
  goconst:
    min-len: 2
    min-occurrences: 3
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/endlesstrax/brokli

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
  exclude-dirs:
    - third_party
    - builtin
    - examples
