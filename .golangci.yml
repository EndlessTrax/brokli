version: "2"
run:
  tests: true
linters:
  enable:
    - goconst
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    goconst:
      min-len: 2
      min-occurrences: 3
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/endlesstrax/brokli
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
