# GoReleaser config for brokli
# See https://goreleaser.com for reference

project_name: brokli

before:
  hooks:
    - go mod tidy

builds:
  - id: brokli
    main: .
    binary: brokli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    goarm: ["7"]

archives:
  - id: release-archives
    builds: [brokli]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'SHA256SUMS.txt'

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'

release:
  # Mark pre-releases if the tag contains a hyphen (e.g., v1.0.0-rc1)
  prerelease: auto
